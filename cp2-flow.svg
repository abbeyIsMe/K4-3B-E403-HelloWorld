<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">CP2 Flow - Lesson Notebook cho VLearn</title>
  <desc id="desc">A polished flow and UI mock showing a source-grounded VLearn tutor that answers only from selected slide and video transcript sources.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#edf2f7"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L11,6.5 L2,11 Z" fill="#334155"/>
    </marker>
    <style>
      .h1 { font: 800 36px Inter, Arial, sans-serif; fill: #0f172a; }
      .h2 { font: 750 21px Inter, Arial, sans-serif; fill: #0f172a; }
      .h3 { font: 750 16px Inter, Arial, sans-serif; fill: #111827; }
      .body { font: 400 15px Inter, Arial, sans-serif; fill: #334155; }
      .muted { font: 400 13px Inter, Arial, sans-serif; fill: #64748b; }
      .tiny { font: 700 12px Inter, Arial, sans-serif; fill: #64748b; letter-spacing: 0.6px; }
      .whiteTitle { font: 800 18px Inter, Arial, sans-serif; fill: #ffffff; }
      .whiteText { font: 500 13px Inter, Arial, sans-serif; fill: #e0f2fe; }
      .pillText { font: 700 12px Inter, Arial, sans-serif; fill: #0f172a; }
      .edge { fill: none; stroke: #334155; stroke-width: 2.4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#pageBg)"/>

  <g transform="translate(72 54)">
    <rect x="0" y="0" width="1456" height="872" rx="28" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    <rect x="0" y="0" width="1456" height="126" rx="28" fill="#f8fafc"/>
    <path d="M0 98 H1456" stroke="#e2e8f0"/>
    <text x="38" y="52" class="h1">Lesson Notebook cho VLearn Tutor</text>
    <text x="38" y="86" class="body">Học viên hỏi một câu. Tutor chỉ trả lời từ slide và video/transcript của bài học đang chọn, kèm citation.</text>
    <rect x="1150" y="34" width="238" height="42" rx="21" fill="#dcfce7" stroke="#86efac"/>
    <text x="1174" y="61" class="pillText">Scope: slide + video only</text>

    <g transform="translate(38 164)">
      <rect x="0" y="0" width="390" height="570" rx="24" fill="#f8fbff" stroke="#dbeafe" filter="url(#softShadow)"/>
      <rect x="0" y="0" width="390" height="92" rx="24" fill="url(#blue)"/>
      <text x="26" y="39" class="whiteTitle">1. Học viên hỏi</text>
      <text x="26" y="66" class="whiteText">Chọn bài học và đặt câu hỏi tự nhiên</text>

      <text x="26" y="132" class="tiny">SOURCE PICKER</text>
      <rect x="26" y="154" width="338" height="118" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="48" y="188" class="h3">Day 1 - Foundation</text>
      <text x="48" y="218" class="body">Nguồn đang bật:</text>
      <rect x="48" y="236" width="92" height="25" rx="12" fill="#dbeafe"/>
      <text x="64" y="253" class="pillText">Slide</text>
      <rect x="150" y="236" width="132" height="25" rx="12" fill="#dbeafe"/>
      <text x="166" y="253" class="pillText">Video transcript</text>

      <text x="26" y="318" class="tiny">ASK BOX</text>
      <rect x="26" y="340" width="338" height="124" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="48" y="382" class="h2">"Token là gì?"</text>
      <text x="48" y="418" class="body">Không cần prompt dài.</text>
      <text x="48" y="442" class="body">Hỏi như đang hỏi tutor.</text>

      <rect x="26" y="500" width="338" height="42" rx="21" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="50" y="527" class="pillText">User sees: tutor chỉ dùng nguồn đã chọn</text>
    </g>

    <g transform="translate(534 164)">
      <rect x="0" y="0" width="390" height="570" rx="24" fill="#fbfaff" stroke="#ddd6fe" filter="url(#softShadow)"/>
      <rect x="0" y="0" width="390" height="92" rx="24" fill="url(#violet)"/>
      <text x="26" y="39" class="whiteTitle">2. Tìm bằng chứng</text>
      <text x="26" y="66" class="whiteText">Retrieval chỉ trong nguồn của bài học</text>

      <text x="26" y="132" class="tiny">ALLOWED SOURCES</text>
      <rect x="26" y="154" width="338" height="96" rx="18" fill="#ffffff" stroke="#ddd6fe"/>
      <rect x="48" y="178" width="50" height="50" rx="14" fill="#ede9fe"/>
      <text x="114" y="196" class="h3">Slide deck</text>
      <text x="114" y="223" class="body">Trang, tiêu đề, bullet chính</text>

      <rect x="26" y="274" width="338" height="96" rx="18" fill="#ffffff" stroke="#ddd6fe"/>
      <rect x="48" y="298" width="50" height="50" rx="14" fill="#ede9fe"/>
      <text x="114" y="316" class="h3">Video transcript</text>
      <text x="114" y="343" class="body">Mã đoạn Txx-NNN, lời giảng</text>

      <text x="26" y="420" class="tiny">EVIDENCE CHECK</text>
      <rect x="26" y="442" width="338" height="88" rx="18" fill="#ffffff" stroke="#ddd6fe"/>
      <text x="48" y="474" class="body">Có đủ căn cứ trong nguồn?</text>
      <text x="48" y="502" class="body">Hay câu hỏi mơ hồ / ngoài phạm vi?</text>

      <line x1="73" y1="188" x2="73" y2="222" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>
      <line x1="61" y1="204" x2="85" y2="204" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>
      <path d="M60 309 H86 M60 323 H86 M60 337 H78" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>
    </g>

    <g transform="translate(1030 164)">
      <rect x="0" y="0" width="390" height="570" rx="24" fill="#f7fefb" stroke="#bbf7d0" filter="url(#softShadow)"/>
      <rect x="0" y="0" width="390" height="92" rx="24" fill="url(#green)"/>
      <text x="26" y="39" class="whiteTitle">3. Trả lời có citation</text>
      <text x="26" y="66" class="whiteText">Có nguồn thì trả lời, không có thì nói rõ</text>

      <text x="26" y="132" class="tiny">ANSWER PANEL</text>
      <rect x="26" y="154" width="338" height="156" rx="18" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="48" y="190" class="h3">Token là đơn vị văn bản nhỏ</text>
      <text x="48" y="218" class="body">mà model xử lý khi dự đoán</text>
      <text x="48" y="242" class="body">phần tiếp theo của chuỗi.</text>
      <rect x="48" y="266" width="104" height="26" rx="13" fill="#dcfce7"/>
      <text x="63" y="284" class="pillText">Slide p.6</text>
      <rect x="162" y="266" width="94" height="26" rx="13" fill="#dcfce7"/>
      <text x="177" y="284" class="pillText">T04-021</text>

      <text x="26" y="360" class="tiny">GUARDRAILS</text>
      <rect x="26" y="382" width="338" height="64" rx="18" fill="#fffbeb" stroke="#fde68a"/>
      <text x="48" y="420" class="body">Mơ hồ: hỏi lại để thu hẹp phạm vi.</text>
      <rect x="26" y="466" width="338" height="64" rx="18" fill="#fef2f2" stroke="#fecaca"/>
      <text x="48" y="504" class="body">Không có trong nguồn: không đoán.</text>
    </g>

    <path class="edge" d="M428 450 C476 450 492 450 534 450"/>
    <path class="edge" d="M924 450 C972 450 988 450 1030 450"/>

    <g transform="translate(38 780)">
      <rect x="0" y="0" width="1320" height="52" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="26" y="33" class="muted">CP2 pass:</text>
      <text x="110" y="33" class="body">TA thấy user hỏi gì, nguồn nào được phép dùng, cách kiểm evidence, và output có citation hoặc từ chối đúng phạm vi.</text>
    </g>
  </g>
</svg>
